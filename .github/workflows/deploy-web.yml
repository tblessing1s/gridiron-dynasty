name: Deploy web prototype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  EXPORT_DIR: build/web

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-stable"
          base_url="https://github.com/godotengine/godot/releases/download/${release}"

          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "${base_url}/Godot_v${release}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -Dm755 \
            "/tmp/godot/Godot_v${release}_linux.x86_64" \
            "${HOME}/.local/bin/godot"

          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "${base_url}/Godot_v${release}_export_templates.tpz"
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${template_dir}"
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          cp -R /tmp/export-templates/templates/. "${template_dir}/"

          godot --version

      - name: Import project and export web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EXPORT_DIR}"
          godot --headless --editor --path . --quit
          godot --headless --path . --export-release "Web" "${EXPORT_DIR}/index.html"
          test -s "${EXPORT_DIR}/index.html"

      - name: Upload portable web build
        uses: actions/upload-artifact@v4
        with:
          name: gridiron-dynasty-web
          path: ${{ env.EXPORT_DIR }}
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
